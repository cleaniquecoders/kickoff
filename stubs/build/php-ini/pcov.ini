; Coverage driver for Pest's Test Impact Analysis (`composer test-tia`) and
; `composer test-coverage`.
;
; This directory is loaded via PHP_INI_SCAN_DIR, which — unlike a `-d` flag —
; is an environment variable and therefore reaches ParaTest's worker processes.
; Pointing at this directory also *replaces* the system conf.d, so Xdebug is
; not loaded during a TIA run: pcov collects the coverage TIA needs at a
; fraction of Xdebug's cost.
;
; If pcov is not installed, `pecl install pcov` first; where no build is
; published for your PHP version, use build/php-ini/build-pcov.sh.

extension=pcov.so

pcov.enabled=1

; Instrument the application only. Without this pcov walks vendor/ as well,
; which is both far slower and useless to TIA — nobody edits vendor.
pcov.directory=.
pcov.exclude="~(vendor|node_modules|storage|bootstrap/cache|public)~"
